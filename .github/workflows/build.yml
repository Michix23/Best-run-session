name: Build Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Android64 mod
          path: ${{ steps.build.outputs.build-output }}